<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="120" fill="#FAFAF8"/>

  <!-- left ribbon/page: soft Obsidian purple -->
  <path d="M 176 110
           L 256 110
           L 256 404
           Q 256 416 246 408
           L 156 344
           Q 146 337 146 322
           L 146 146
           Q 146 110 176 110
           Z" fill="#9B59E0"/>
  <!-- left page edge lines -->
  <path d="M 196 140 L 196 384" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="7" stroke-linecap="round"/>
  <path d="M 222 140 L 222 396" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="7" stroke-linecap="round"/>

  <!-- right ribbon/page: Claude clay orange -->
  <path d="M 336 110
           L 256 110
           L 256 404
           Q 256 416 266 408
           L 356 344
           Q 366 337 366 322
           L 366 146
           Q 366 110 336 110
           Z" fill="#D97757"/>
  <!-- right page edge lines -->
  <path d="M 316 140 L 316 384" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="7" stroke-linecap="round"/>
  <path d="M 290 140 L 290 396" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="7" stroke-linecap="round"/>

  <!-- spine shadow -->
  <path d="M256 110 L256 404" stroke="#000000" stroke-opacity="0.14" stroke-width="6"/>

  <text x="256" y="262" text-anchor="middle" dominant-baseline="central"
        font-family="DejaVu Sans" font-weight="bold" font-size="200"
        fill="#FFFFFF" stroke="#FFFFFF" stroke-width="16" paint-order="stroke" stroke-linejoin="round">$</text>
</svg>
