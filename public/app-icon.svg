<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="112" fill="#FAFAF8"/>

  <!-- left book page: soft Obsidian purple, pointed top/bottom like a page corner -->
  <path d="M256 56
           L196 102
           C 162 126 148 148 148 172
           L148 340
           C 148 364 162 386 196 410
           L256 456
           Z" fill="#9B59E0"/>
  <!-- left page edge lines (suggests stacked pages underneath) -->
  <path d="M210 96 C 178 122 166 144 166 172 L166 340 C 166 366 178 386 210 410" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6" stroke-linecap="round"/>
  <path d="M232 76 C 196 106 184 132 184 164 L184 348 C 184 378 196 402 232 432" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="6" stroke-linecap="round"/>

  <!-- right book page: Claude clay orange -->
  <path d="M256 56
           L316 102
           C 350 126 364 148 364 172
           L364 340
           C 364 364 350 386 316 410
           L256 456
           Z" fill="#D97757"/>
  <!-- right page edge lines -->
  <path d="M302 96 C 334 122 346 144 346 172 L346 340 C 346 366 334 386 302 410" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6" stroke-linecap="round"/>
  <path d="M280 76 C 316 106 328 132 328 164 L328 348 C 328 378 316 402 280 432" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="6" stroke-linecap="round"/>

  <!-- spine shadow -->
