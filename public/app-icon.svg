  <text x="256" y="266" text-anchor="middle" dominant-baseline="central"
        font-family="DejaVu Sans" font-weight="bold" font-size="196"
        fill="#FFFFFF" stroke="#FFFFFF" stroke-width="16" paint-order="stroke" stroke-linejoin="round">$</text>
</svg>
